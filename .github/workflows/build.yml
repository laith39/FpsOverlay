name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/laith/fpsoverlay
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "FpsOverlay"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.laith.fpsoverlay"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.laith.fpsoverlay"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:label="FPS Overlay"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="overlay"/>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/laith/fpsoverlay/MainActivity.kt <<'EOF'
          package com.laith.fpsoverlay

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout

          class MainActivity : Activity() {
              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 200, 48, 48)
                  }
                  root.addView(Button(this).apply {
                      text = "تشغيل القياسات"
                      setOnClickListener { startOverlay() }
                  })
                  root.addView(Button(this).apply {
                      text = "إيقاف"
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, OverlayService::class.java))
                      }
                  })
                  setContentView(root)
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
              }

              private fun startOverlay() {
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(
                          Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                      )
                      return
                  }
                  startForegroundService(Intent(this, OverlayService::class.java))
              }
          }
          EOF
          cat > app/src/main/java/com/laith/fpsoverlay/OverlayService.kt <<'EOF'
          package com.laith.fpsoverlay

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.BatteryManager
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.TextView

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private var tv: TextView? = null
              private val h = Handler(Looper.getMainLooper())
              private val tick = object : Runnable {
                  override fun run() { update(); h.postDelayed(this, 1000) }
              }

              override fun onBind(i: Intent?): IBinder? = null
              override fun onStartCommand(i: Intent?, f: Int, id: Int) = START_STICKY

              override fun onCreate() {
                  super.onCreate()
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("ov", "Overlay", NotificationManager.IMPORTANCE_LOW)
                  )
                  val n = Notification.Builder(this, "ov")
                      .setContentTitle("FPS Overlay يعمل")
                      .setSmallIcon(android.R.drawable.ic_menu_info_details)
                      .build()
                  startForeground(1, n)

                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  tv = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      setPadding(24, 12, 24, 12)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#99000000"))
                          cornerRadius = 24f
                      }
                  }
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = 20
                  lp.y = 60
                  wm.addView(tv, lp)
                  h.post(tick)
              }

              private fun update() {
                  val b = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val t = (b?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0) / 10f
                  val lvl = b?.getIntExtra(BatteryManager.EXTRA_LEVEL, 0) ?: 0
                  val mi = ActivityManager.MemoryInfo()
                  getSystemService(ActivityManager::class.java).getMemoryInfo(mi)
                  val used = (mi.totalMem - mi.availMem) / 1073741824f
                  val tot = mi.totalMem / 1073741824f
                  tv?.text = String.format("BAT %.1f°C  %d%%\nRAM %.1f / %.1f GB", t, lvl, used, tot)
              }

              override fun onDestroy() {
                  h.removeCallbacks(tick)
                  tv?.let { wm.removeView(it) }
                  super.onDestroy()
              }
          }
          EOF
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FpsOverlay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
