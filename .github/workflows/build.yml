name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/laith/fpsoverlay
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "FpsOverlay"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.laith.fpsoverlay"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.laith.fpsoverlay"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 5
                  versionName = "1.4"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("dev.rikka.shizuku:api:12.2.0")
              implementation("dev.rikka.shizuku:provider:12.2.0")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:label="FPS Overlay"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="overlay"/>
                  </service>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL"/>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/laith/fpsoverlay/MainActivity.kt <<'EOF'
          package com.laith.fpsoverlay

          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast
          import rikka.shizuku.Shizuku

          class MainActivity : Activity() {
              private val tools = listOf(
                  "FPS" to "معدل الإطارات (FPS)",
                  "RAM" to "استهلاك الذاكرة (RAM)",
                  "BAT" to "نسبة البطارية",
                  "TMP" to "حرارة البطارية",
                  "CPU" to "حرارة المعالج (CPU)",
                  "GPU" to "حرارة الرسوميات (GPU)"
              )
              private lateinit var statusText: TextView

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  val prefs = getSharedPreferences("p", MODE_PRIVATE)
                  window.decorView.setBackgroundColor(Color.parseColor("#0B0F19"))

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 60, 40, 60)
                  }

                  val headerCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 40, 40, 40)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#151C2C"))
                          cornerRadius = 24f
                          setStroke(2, Color.parseColor("#1E293B"))
                      }
                  }

                  val title = TextView(this).apply {
                      text = "⚡ FPS Overlay"
                      textSize = 22f
                      setTextColor(Color.parseColor("#FFFFFF"))
                      setTypeface(null, android.graphics.Typeface.BOLD)
                  }
                  headerCard.addView(title)

                  statusText = TextView(this).apply {
                      textSize = 13f
                      setPadding(0, 16, 0, 0)
                      setTextColor(Color.parseColor("#94A3B8"))
                  }
                  headerCard.addView(statusText)
                  root.addView(headerCard)

                  root.addView(View(this), LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 30))

                  val btnStart = createStyledButton("تشغيل القياسات العائمة", "#FF5A1F", Color.WHITE) { startOverlay() }
                  val btnStop = createStyledButton("إيقاف الشريط", "#1E293B", Color.parseColor("#CBD5E1")) {
                      stopService(Intent(this@MainActivity, OverlayService::class.java))
                      Toast.makeText(this, "تم إيقاف الخدمة", Toast.LENGTH_SHORT).show()
                  }
                  val btnShizuku = createStyledButton("منح إذن Shizuku / فحص الروت", "#1E293B", Color.parseColor("#38BDF8")) { askShizuku() }

                  root.addView(btnStart)
                  root.addView(View(this), LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 16))
                  root.addView(btnStop)
                  root.addView(View(this), LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 16))
                  root.addView(btnShizuku)

                  root.addView(View(this), LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 40))
                  val settingsTitle = TextView(this).apply {
                      text = "تخصيص العناصر الظاهرة"
                      textSize = 15f
                      setTextColor(Color.parseColor("#38BDF8"))
                      setTypeface(null, android.graphics.Typeface.BOLD)
                  }
                  root.addView(settingsTitle)
                  root.addView(View(this), LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 16))

                  for ((key, label) in tools) {
                      val sw = Switch(this).apply {
                          text = label
                          textSize = 15f
                          setTextColor(Color.parseColor("#E2E8F0"))
                          isChecked = prefs.getBoolean(key, true)
                          setOnCheckedChangeListener { _, c ->
                              prefs.edit().putBoolean(key, c).apply()
                          }
                          setPadding(10, 16, 10, 16)
                      }
                      root.addView(sw)
                  }

                  root.addView(View(this), LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 30))
                  
                  val swHoriz = Switch(this).apply {
                      text = "عرض الشريط بشكل أفقي"
                      textSize = 15f
                      setTextColor(Color.parseColor("#E2E8F0"))
                      isChecked = prefs.getBoolean("horizontal", false)
                      setOnCheckedChangeListener { _, c -> prefs.edit().putBoolean("horizontal", c).apply() }
                      setPadding(10, 16, 10, 16)
                  }
                  root.addView(swHoriz)

                  val swLock = Switch(this).apply {
                      text = "إلغاء قفل التحريك (لتحريك الشريط بإصبعك)"
                      textSize = 15f
                      setTextColor(Color.parseColor("#E2E8F0"))
                      isChecked = !prefs.getBoolean("locked", true)
                      setOnCheckedChangeListener { _, c -> prefs.edit().putBoolean("locked", !c).apply() }
                      setPadding(10, 16, 10, 16)
                  }
                  root.addView(swLock)

                  val sizeLabel = TextView(this).apply {
                      textSize = 14f
                      setPadding(10, 24, 10, 8)
                      setTextColor(Color.parseColor("#94A3B8"))
                      text = "حجم الشريط: " + prefs.getInt("scale", 100) + "%"
                  }
                  root.addView(sizeLabel)

                  val seekBar = SeekBar(this).apply {
                      max = 100
                      progress = prefs.getInt("scale", 100) - 50
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(sb: SeekBar?, p: Int, fromUser: Boolean) {
                              val v = p + 50
                              sizeLabel.text = "حجم الشريط: $v%"
                              prefs.edit().putInt("scale", v).apply()
                          }
                          override fun onStartTrackingTouch(sb: SeekBar?) {}
                          override fun onStopTrackingTouch(sb: SeekBar?) {}
                      })
                  }
                  root.addView(seekBar)

                  setContentView(ScrollView(this).apply { addView(root) })
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
              }

              private fun createStyledButton(txt: String, bgColor: String, textColor: Int, onClick: () -> Unit): Button {
                  return Button(this).apply {
                      text = txt
                      setTextColor(textColor)
                      textSize = 15f
                      isAllCaps = false
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor(bgColor))
                          cornerRadius = 16f
                      }
                      setOnClickListener { onClick() }
                      setPadding(24, 28, 24, 28)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  refreshStatus()
              }

              private fun refreshStatus() {
                  statusText.text = try {
                      val hasRoot = Runtime.getRuntime().exec(arrayOf("su", "-c", "id")).waitFor() == 0
                      if (hasRoot) "الحالة: متصل عبر صلاحيات الروت (Root) ✅"
                      else if (Shizuku.pingBinder() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED)
                          "الحالة: يعمل عبر Shizuku ✅"
                      else "الحالة: يرجى منح إذن Shizuku أو الروت ⚠️"
                  } catch (e: Throwable) {
                      "الحالة: تعذّر التحقق من الصلاحيات"
                  }
              }

              private fun askShizuku() {
                  try {
                      val rootProcess = Runtime.getRuntime().exec(arrayOf("su", "-c", "id"))
                      if (rootProcess.waitFor() == 0) {
                        Toast.makeText(this, "تم اكتشاف صلاحيات الروت بنجاح!", Toast.LENGTH_SHORT).show()
                          refreshStatus()
                          return
                      }
                  } catch (e: Throwable) {}

                  try {
                      if (!Shizuku.pingBinder()) {
                          Toast.makeText(this, "شغّل تطبيق Shizuku أولاً", Toast.LENGTH_LONG).show()
                      } else if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                          Shizuku.requestPermission(100)
                      } else {
                          Toast.makeText(this, "إذن Shizuku ممنوح مسبقاً", Toast.LENGTH_SHORT).show()
                      }
                  } catch (e: Throwable) {
                      Toast.makeText(this, "خطأ في الاتصال بـ Shizuku", Toast.LENGTH_LONG).show()
                  }
                  refreshStatus()
              }

              private fun startOverlay() {
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  startForegroundService(Intent(this, OverlayService::class.java))
                  Toast.makeText(this, "تم بدء تشغيل الشريط العائم", Toast.LENGTH_SHORT).show()
              }
          }
          EOF
          cat > app/src/main/java/com/laith/fpsoverlay/OverlayService.kt <<'EOF'
          package com.laith.fpsoverlay

          import android.app.ActivityManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.BatteryManager
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView
          import rikka.shizuku.Shizuku
          import kotlin.concurrent.thread

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var prefs: SharedPreferences
              private lateinit var lp: WindowManager.LayoutParams
              private var panel: LinearLayout? = null
              private val h = Handler(Looper.getMainLooper())
              private val values = HashMap<String, TextView>()
              private val rows = HashMap<String, View>()
              private var builtKey = ""
              @Volatile private var running = true
              @Volatile private var fpsT = "--"
              @Volatile private var cpuT = "--"
              @Volatile private var gpuT = "--"
              private var fpsLayer = ""
              private val defs = listOf(
                  "FPS" to "#FF5A1F",
                  "RAM" to "#3B5BFF",
                  "BAT" to "#22C55E",
                  "TMP" to "#EF4444",
                  "CPU" to "#A855F7",
                  "GPU" to "#EAB308"
              )
              private val listener = SharedPreferences.OnSharedPreferenceChangeListener { _, _ -> applyPrefs() }

              override fun onBind(i: Intent?): IBinder? = null
              override fun onStartCommand(i: Intent?, f: Int, id: Int) = START_STICKY

              private fun d(v: Float): Int = maxOf(1, (v * resources.displayMetrics.density).toInt())

              override fun onCreate() {
                  super.onCreate()
                  prefs = getSharedPreferences("p", MODE_PRIVATE)
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("ov", "Overlay", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "ov")
                      .setContentTitle("FPS Overlay يعمل في الخلفية")
                      .setSmallIcon(android.R.drawable.ic_menu_info_details)
                      .build()
                  startForeground(1, n)

                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val bg = GradientDrawable().apply {
                      setColor(Color.parseColor("#E60B1226"))
                      cornerRadius = d(10f).toFloat()
                      setStroke(1, Color.parseColor("#334155"))
                  }
                  val p = LinearLayout(this).apply { background = bg }
                  panel = p
                  lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = prefs.getInt("x", 20)
                  lp.y = prefs.getInt("y", 80)

                  p.setOnTouchListener(object : View.OnTouchListener {
                      var sx = 0f; var sy = 0f; var ox = 0; var oy = 0
                      override fun onTouch(v: View, e: MotionEvent): Boolean {
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> { sx = e.rawX; sy = e.rawY; ox = lp.x; oy = lp.y }
                              MotionEvent.ACTION_MOVE -> {
                                  lp.x = ox + (e.rawX - sx).toInt()
                                  lp.y = oy + (e.rawY - sy).toInt()
                                  try { wm.updateViewLayout(v, lp) } catch (ex: Exception) {}
                              }
                              MotionEvent.ACTION_UP -> { prefs.edit().putInt("x", lp.x).putInt("y", lp.y).apply() }
                          }
                          return true
                      }
                  })

                  wm.addView(p, lp)
                  prefs.registerOnSharedPreferenceChangeListener(listener)
                  applyPrefs()
                  startWorker()
              }

              private fun applyPrefs() {
                  h.post {
                      val p = panel
                      if (p != null) {
                          val key = prefs.getBoolean("horizontal", false).toString() + prefs.getInt("scale", 100)
                          if (key != builtKey) {
                              builtKey = key
                              build(p)
                          }
                          val locked = prefs.getBoolean("locked", true)
                          lp.flags = if (locked) WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                          else WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                          lp.x = prefs.getInt("x", 20)
                          lp.y = prefs.getInt("y", 80)
                          (p.background as GradientDrawable).setStroke(if (locked) d(1f) else d(2f), if (locked) Color.parseColor("#334155") else Color.parseColor("#38BDF8"))
                          try { wm.updateViewLayout(p, lp) } catch (ex: Exception) {}
                          update()
                      }
                  }
              }

              private fun build(p: LinearLayout) {
                  val horizontal = prefs.getBoolean("horizontal", false)
                  val s = prefs.getInt("scale", 100) / 100f
                  p.removeAllViews()
                  values.clear()
                  rows.clear()
                  p.orientation = if (horizontal) LinearLayout.HORIZONTAL else LinearLayout.VERTICAL
                  p.setPadding(d(12f * s), d(8f * s), d(12f * s), d(8f * s))
                  for ((key, color) in defs) {
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                      }
                      row.addView(View(this).apply { setBackgroundColor(Color.parseColor(color)) }, LinearLayout.LayoutParams(d(5f * s), d(36f * s)))
                      val col = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(d(8f * s), 0, 0, 0)
                      }
                      col.addView(TextView(this).apply {
                          text = key
                          textSize = 9f * s
                          typeface = Typeface.MONOSPACE
                          setTextColor(Color.parseColor("#94A3B8"))
                      })
                      val v = TextView(this).apply {
                          text = "--"
                          textSize = 16f * s
                          typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                          setTextColor(Color.WHITE)
                      }
                      col.addView(v)
                      row.addView(col)
                      val rlp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      if (horizontal) rlp.setMargins(0, 0, d(14f * s), 0)
                      else rlp.setMargins(0, d(4f * s), 0, d(4f * s))
                      p.addView(row, rlp)
                      values[key] = v
                      rows[key] = row
                  }
              }

              private fun sh(cmd: String): String {
                  try {
                      val pr = Runtime.getRuntime().exec(arrayOf("su", "-c", cmd))
                      val out = pr.inputStream.bufferedReader().readText()
                      pr.waitFor()
                      if (out.isNotBlank()) return out
                  } catch (e: Throwable) {}

                  try {
                      if (Shizuku.pingBinder() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) {
                          val pr = Shizuku.newProcess(arrayOf("sh", "-c", cmd), null, null)
                          val out = pr.inputStream.bufferedReader().readText()
                          pr.waitFor()
                          return out
                      }
                  } catch (e: Throwable) {}
                  return ""
              }

              private fun readTemps() {
                  val out = sh("grep . /sys/class/thermal/thermal_zone*/type /sys/class/thermal/thermal_zone*/temp 2>/dev/null")
                  val types = HashMap<String, String>()
                  val temps = HashMap<String, Float>()
                  for (line in out.lines()) {
                      val idx = line.indexOf(':')
                      if (idx < 0) continue
                      val path = line.substring(0, idx)
                      val content = line.substring(idx + 1).trim()
                      val zone = path.substringAfterLast("thermal_zone").substringBefore("/")
                      if (path.endsWith("/type")) {
                          types[zone] = content.lowercase()
                      } else if (path.endsWith("/temp")) {
                          val raw = content.toFloatOrNull() ?: continue
                          val c = if (raw > 1000f) raw / 1000f else raw
                          if (c in 1f..150f) temps[zone] = c
                      }
                  }
                  var cpu = -1f; var gpu = -1f; var generalMax = -1f
                  for ((zone, type) in types) {
                      val t = temps[zone] ?: continue
                      if (t > generalMax) generalMax = t
                      if (type.contains("gpu") || type.contains("g3d") || type.contains("mali") || type.contains("adreno")) {
                          if (t > gpu) gpu = t
                      } else if (type.contains("cpu") || type.contains("core") || type.contains("cluster") || type.contains("soc") || type.contains("mtk") || type.contains("tsens")) {
                          if (t > cpu) cpu = t
                      }
                  }
                  if (cpu < 0f) cpu = generalMax
                  cpuT = if (cpu > 0f) cpu.toInt().toString() else "--"
                  gpuT = if (gpu > 0f) gpu.toInt().toString() else "--"
              }

              private fun layerFps(layer: String): Int {
                  val q = layer.replace("'", "'\\''")
                  val out = sh("dumpsys SurfaceFlinger --latency '$q' 2>/dev/null")
                  val ts = ArrayList<Long>()
                  val lines = out.lines()
                  for (i in 1 until lines.size) {
                      val parts = lines[i].trim().split(Regex("\\s+"))
                      if (parts.size < 3) continue
                      val t = parts[1].toLongOrNull() ?: continue
                      if (t > 0L && t < 4_000_000_000_000_000_000L) ts.add(t)
                  }
                  if (ts.isEmpty()) return -1
                  val newest = ts.max()
                  if (System.nanoTime() - newest > 2_000_000_000L) return 0
                  val win = ts.filter { it > newest - 1_000_000_000L }
                  if (win.size < 2) return win.size
                  val span = (win.max() - win.min()).toDouble()
                  if (span <= 0.0) return win.size
                  val f = Math.round((win.size - 1) * 1e9 / span).toInt()
                  return minOf(f, 240)
              }

              private fun readFps(): String {
                  if (fpsLayer.isNotEmpty()) {
                      val f = layerFps(fpsLayer)
                      if (f > 0) return f.toString()
                  }
                  fpsLayer = ""
                  var focus = sh("dumpsys window 2>/dev/null | grep -m1 mCurrentFocus")
                  var m = Regex("([A-Za-z0-9_.]+)/").find(focus)
                  if (m == null) {
                      focus = sh("dumpsys activity activities 2>/dev/null | grep -m1 -E 'mResumedActivity|topResumedActivity'")
                      m = Regex("([A-Za-z0-9_.]+)/").find(focus)
                  }
                  val pkg = m?.groupValues?.get(1) ?: return "--"
                  val list = sh("dumpsys SurfaceFlinger --list 2>/dev/null").lines()
                      .filter { it.contains(pkg) && !it.startsWith("Background") && !it.startsWith("Bounds") && !it.contains("Task=") }
                      .sortedByDescending { it.contains("SurfaceView") }
                      .take(4)
                  if (list.isEmpty()) return "--"
                  for (l in list) {
                      val f = layerFps(l)
                      if (f > 0) {
                          fpsLayer = l
                          return f.toString()
                      }
                  }
                  return "0"
              }

              private fun startWorker() {
                  thread(isDaemon = true) {
                      while (running) {
                          val t0 = System.currentTimeMillis()
                          try {
                              fpsT = readFps()
                              readTemps()
                          } catch (e: Throwable) {
                              fpsT = "--"
                          }
                          h.post { update() }
                          val dt = System.currentTimeMillis() - t0
                          try { Thread.sleep(maxOf(0L, 1000L - dt)) } catch (e: Exception) {}
                      }
                  }
              }

              private fun update() {
                  if (panel == null) return
                  val b = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val t = (b?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0) / 10
                  val lvl = b?.getIntExtra(BatteryManager.EXTRA_LEVEL, 0) ?: 0
                  val mi = ActivityManager.MemoryInfo()
                  getSystemService(ActivityManager::class.java).getMemoryInfo(mi)
                  val ramPct = ((mi.totalMem - mi.availMem) * 100 / mi.totalMem).toInt()
                  for ((key, v) in values) {
                      val on = prefs.getBoolean(key, true)
                      rows[key]?.visibility = if (on) View.VISIBLE else View.GONE
                      if (!on) continue
                      v.text = when (key) {
                          "FPS" -> fpsT
                          "RAM" -> ramPct.toString()
                          "BAT" -> lvl.toString()
                          "TMP" -> t.toString()
                          "CPU" -> cpuT
                          "GPU" -> gpuT
                          else -> "--"
                      }
                  }
              }

              override onDestroy() {
                  running = false
                  prefs.unregisterOnSharedPreferenceChangeListener(listener)
                  panel?.let { try { wm.removeView(it) } catch (e: Exception) {} }
                  panel = null
                  super.onDestroy()
              }
          }
          EOF
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FpsOverlay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
